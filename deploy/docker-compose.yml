# QE Connect with PostgreSQL.  From the project root:
#   copy deploy/.env.docker.example to deploy/.env and set the passwords, then
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qec
      POSTGRES_USER: qec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - qec-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qec -d qec"]
      interval: 10s
      retries: 5
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      QEC_DATABASE_URL: postgresql+psycopg://qec:${POSTGRES_PASSWORD}@db:5432/qec
    ports:
      - "${QEC_PORT:-8000}:8000"
    volumes:
      - qec-data:/data
volumes:
  qec-db:
  qec-data:
